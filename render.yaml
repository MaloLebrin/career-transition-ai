# Blueprint Render — scénario 1 du runbook (docs/DEPLOYMENT.md §1) : usage perso, 0 €.
#
# Un seul web service en plan Free, base Postgres sur Neon (hors Render),
# QUEUE_DRIVER=sync (jobs exécutés dans le process web, pas de worker).
# Le plan Free n'a ni pre-deploy command ni shell : migrations et seed
# (idempotents) s'exécutent dans la commande de démarrage.
#
# Les valeurs `sync: false` sont demandées par Render à la création du
# Blueprint et ne sont jamais écrites dans ce fichier.
# Garde : tests/unit/hygiene/render_blueprint.spec.ts.

services:
  - type: web
    name: career-transition-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm@10.18.3 && pnpm install --frozen-lockfile && pnpm build
    startCommand: node build/bin/console.js migration:run --force && node build/bin/console.js db:seed --files database/seeders/admin_seeder && node build/bin/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: TZ
        value: Europe/Paris
      - key: LOG_LEVEL
        value: info
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: APP_KEY
        sync: false
      - key: SESSION_DRIVER
        value: cookie

      # Base Neon : URL directe avec ?sslmode=require (runbook §1.2)
      - key: DB_URL
        sync: false
      - key: DB_SSL
        value: "true"

      # Un seul process : pas de worker permanent sur Neon Free
      - key: QUEUE_DRIVER
        value: sync

      # Compte super admin créé par admin_seeder
      - key: ADMIN_PASSWORD
        sync: false

      # Beta fermée : pas d'inscription publique (comptes créés par le super admin)
      - key: REGISTRATION_ENABLED
        value: "false"

      # Mail : `console` tant que le domaine n'est pas vérifié chez Resend ; le lien
      # d'onboarding est lu dans les logs Render. Ensuite : MAIL_PROVIDER=resend,
      # RESEND_API_KEY et MAIL_FROM_EMAIL=no-reply@<domaine> (docs/MAIL.md, issue #19).
      - key: MAIL_PROVIDER
        value: console
      - key: MAIL_FROM_EMAIL
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: Career Transition AI

      # IA (serveur uniquement, aucune clé VITE_*)
      - key: AI_PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest

      # Stockage des fichiers (config/cloudinary.ts), requis en production
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Suivi des erreurs (Sentry, région EU). Release = RENDER_GIT_COMMIT (fourni par Render).
      - key: SENTRY_DSN
        sync: false
