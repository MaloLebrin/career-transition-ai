services:
  postgres:
    image: postgres:16-alpine
    container_name: career-transition-ai-db
    environment:
      POSTGRES_USER: career_transition_ai
      POSTGRES_PASSWORD: career_transition_ai_secret
      POSTGRES_DB: career_transition_ai
    ports:
      - '5439:5432'
    volumes:
      - career_transition_ai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U career_transition_ai']
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de test — `pnpm test:db:up` / `pnpm test:db:down`.
  # Profil `test` : ne démarre pas avec `docker compose up`. Données en tmpfs :
  # rien à nettoyer, chaque démarrage repart d'une base vide. Identifiants et
  # port alignés sur `.env.test` et sur le bloc `env:` des jobs de tests de la CI.
  postgres_test:
    profiles: [test]
    image: postgres:16-alpine
    container_name: career-transition-ai-db-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - '5432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d test']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    command: server
    ports:
      - '${PORT:-8080}:8080'
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: worker
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  career_transition_ai_pg_data:
