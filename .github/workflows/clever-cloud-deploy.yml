# Deploy to Clever Cloud via clever-tools (git push to app remote).
# See docs/clever-cloud.md — GitHub Actions.

name: Clever Cloud deploy

on:
  workflow_run:
    workflows: ["CI build typecheck"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git branch to checkout and push to Clever (e.g. main)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  deploy-dev:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: clever-dev-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create branch from validated commit
        run: git checkout -B "${{ github.event.workflow_run.head_branch }}" "${{ github.event.workflow_run.head_sha }}"

      - name: Deploy to Clever Cloud (dev)
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
        run: npx --yes clever-tools@latest deploy --app "${{ secrets.CLEVER_APP_ID_DEV }}" --branch "${{ github.event.workflow_run.head_branch }}"

  deploy-prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: clever-prod
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        env:
          NODE_ENV: test
          PORT: 3333
          HOST: localhost
          APP_KEY: ci_app_key
          LOG_LEVEL: info
          SESSION_DRIVER: cookie
          QUEUE_DRIVER: database
          VITE_AI_PROVIDER: none
        run: pnpm typecheck

      - name: Build (node ace build)
        env:
          NODE_ENV: test
          PORT: 3333
          HOST: localhost
          APP_KEY: ci_app_key
          LOG_LEVEL: info
          SESSION_DRIVER: cookie
          QUEUE_DRIVER: database
          VITE_AI_PROVIDER: none
        run: pnpm build

      - name: Deploy to Clever Cloud (prod)
        env:
          CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
          CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
          DEPLOY_BRANCH: ${{ github.event.inputs.ref || 'main' }}
        run: npx --yes clever-tools@latest deploy --app "${{ secrets.CLEVER_APP_ID_PROD }}" --branch "$DEPLOY_BRANCH"
