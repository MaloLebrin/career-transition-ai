name: CI

# Économie de minutes (docs/TESTING.md § « Coût de la CI ») :
# - pas de CI sur une PR en draft : elle part au passage en « Ready for review » ;
# - un nouveau push annule le run en cours de la même PR (ou de `main`) ;
# - le job `plan` lit les fichiers modifiés : une PR de doc seule ne fait
#   tourner que le shard unit-integration (garde des liens `docs_links.spec.ts`),
#   et `docker-image` ne tourne que si l'image ou la pile de prod peut changer ;
# - les jobs sautés apparaissent « skipped », ce que la protection de branche
#   compte comme un succès — pas de `paths-ignore`, qui laisserait les checks
#   requis en attente pour toujours.
on:
  push:
    branches: [main]
  pull_request:
    # `converted_to_draft` : le run démarre, `plan` est sauté, et la
    # concurrence annule le run qui tournait encore.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Unique point d'entrée : draft → tout est sauté (les autres jobs en dépendent).
  # La matrice de shards n'est pas écrite à la main : `scripts/ci_test_shards.mjs`
  # la dérive de `tests/functional/` et équilibre les specs au fichier près. Un
  # nouveau répertoire de tests est donc shardé sans toucher à ce fichier — une
  # liste `--files` maintenue ici serait une allowlist, et tout répertoire absent
  # de cette liste ne tournerait jamais en CI sans que rien n'échoue.
  plan:
    name: plan (changements, matrice)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
      docker: ${{ steps.changes.outputs.docker }}
      shards: ${{ steps.compute.outputs.shards }}
    steps:
      # Profondeur 2 : sur une PR, HEAD est le commit de merge et HEAD^1 la
      # base ; sur `main` (squash), HEAD^1 est le commit précédent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        name: Fichiers modifiés
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git rev-parse -q --verify HEAD^1 >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          # Doc seule : Markdown, docs/, règles des agents.
          if echo "$files" | grep -qvE '^(docs/|\.claude/|\.cursor/)|\.mdc?$|^LICENSE$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Image et pile de prod : le reste du build est couvert par smoke-prod-build.
          if echo "$files" | grep -qE '^(Dockerfile|\.dockerignore|docker/|deploy/|scripts/smoke_compose_prod\.sh|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Script sans dépendance : pas de pnpm install à payer pour 150 ms de calcul.
      - id: compute
        name: Matrice des shards
        run: |
          if [ "${{ steps.changes.outputs.code }}" = true ]; then
            echo "shards=$(node scripts/ci_test_shards.mjs)" >> "$GITHUB_OUTPUT"
            node scripts/ci_test_shards.mjs --explain
          else
            echo "shards=$(node scripts/ci_test_shards.mjs --unit-only)" >> "$GITHUB_OUTPUT"
            echo "Doc seule : shard unit-integration uniquement."
          fi

  # Lint, typecheck et Vitest dans un seul job : une seule installation des
  # dépendances, et une seule minute arrondie au lieu de trois. Chaque étape
  # tourne même si la précédente échoue, pour tout voir en un run.
  checks:
    name: lint · typecheck · test-frontend
    needs: [plan]
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Pas de `version:` ici : l'action lit `packageManager` de package.json,
      # qui reste la source unique de vérité. Les deux en même temps font
      # échouer le setup (« Multiple versions of pnpm specified »).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Frontend tests (Vitest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:inertia

  # Test de fumée du build de production — tient aussi lieu de job `build` :
  # il lance `pnpm run build` avant de démarrer `build/` comme en production
  # (NODE_ENV=production, dépendances de prod seules, hors du dépôt). Il échoue
  # si `/health`, `/` ou `/auth/login` ne répondent pas 200 avec le rendu SSR,
  # si un asset du manifest manque, ou si les logs du serveur ou du worker
  # contiennent une erreur ou « No jobs found for locations ».
  # Voir scripts/smoke_prod_build.mjs.
  smoke-prod-build:
    needs: [plan]
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Environnement de production minimal. La base reprend les identifiants du
    # service `postgres_test` / `.env.test` ; le reste est propre à ce job
    # (NODE_ENV=production, session cookie, queue database, LOG_LEVEL=info pour
    # voir l'avertissement de jobs introuvables).
    env:
      NODE_ENV: production
      TZ: UTC
      PORT: 3333
      HOST: 127.0.0.1
      APP_URL: http://127.0.0.1:3333
      APP_KEY: smoke-test-only-app-key-not-a-secret
      LOG_LEVEL: info
      SESSION_DRIVER: cookie
      QUEUE_DRIVER: database
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: test
      DB_PASSWORD: test
      DB_DATABASE: test
      DB_SSL: false
      AI_PROVIDER: none
      # Exigées au démarrage en production (config/cloudinary.ts) ; factices,
      # aucun fichier n'est envoyé pendant le smoke.
      CLOUDINARY_CLOUD_NAME: smoke
      CLOUDINARY_API_KEY: smoke-key
      CLOUDINARY_API_SECRET: smoke-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run build
      # Copie hors du dépôt : depuis `build/`, Node remonterait jusqu'au
      # `node_modules` racine et masquerait une dépendance de dev importée au
      # runtime. `pnpm install --prod` reproduit l'installation de production.
      - name: Installer le build comme en production
        run: |
          cp -r build "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app" && pnpm install --prod --frozen-lockfile --prefer-offline
      - name: Migrations depuis le build
        working-directory: ${{ runner.temp }}/app
        run: node ace.js migration:run --force
      - name: Test de fumée (serveur, pages SSR, assets, worker)
        run: node scripts/smoke_prod_build.mjs --app-dir="$RUNNER_TEMP/app"

  # Image Docker (issues #14 et #16) : construit le Dockerfile tel qu'il serait déployé,
  # puis déroule les modes de l'entrypoint dans l'ordre d'un déploiement —
  # `migrate`, `seed`, `server` — et échoue si `/health` ne répond pas 200, si
  # le conteneur ne tourne pas en `node` ou si son HEALTHCHECK n'est pas
  # `healthy`. Même base et même env minimal que `smoke-prod-build`.
  # Ne tourne que si l'image peut changer (`plan.outputs.docker`) ; les couches
  # sont mises en cache (cache GitHub Actions) pour ne pas tout reconstruire.
  docker-image:
    needs: [plan]
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: career-transition-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Env du conteneur
        run: |
          cat > "$RUNNER_TEMP/docker.env" <<'EOF'
          TZ=UTC
          APP_URL=http://localhost:8080
          APP_KEY=smoke-test-only-app-key-not-a-secret
          LOG_LEVEL=info
          SESSION_DRIVER=cookie
          QUEUE_DRIVER=database
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=test
          DB_PASSWORD=test
          DB_DATABASE=test
          DB_SSL=false
          AI_PROVIDER=none
          CLOUDINARY_CLOUD_NAME=smoke
          CLOUDINARY_API_KEY=smoke-key
          CLOUDINARY_API_SECRET=smoke-secret
          ADMIN_PASSWORD=ci-only-admin-password
          EOF
      - name: Mode migrate
        run: docker run --rm --network host --env-file "$RUNNER_TEMP/docker.env" career-transition-ai:ci migrate
      - name: Mode seed (admin)
        run: docker run --rm --network host --env-file "$RUNNER_TEMP/docker.env" career-transition-ai:ci seed
      - name: Mode server (/health, utilisateur, HEALTHCHECK)
        run: |
          docker run -d --name web --network host --env-file "$RUNNER_TEMP/docker.env" career-transition-ai:ci server
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ] || { docker logs web; echo "/health a répondu $code"; exit 1; }
          user=$(docker exec web id -un)
          [ "$user" = node ] || { echo "le conteneur tourne en $user, attendu node"; exit 1; }
          for i in $(seq 1 30); do
            health=$(docker inspect -f '{{.State.Health.Status}}' web)
            [ "$health" = healthy ] && break
            sleep 3
          done
          [ "$health" = healthy ] || { docker logs web; echo "HEALTHCHECK : $health"; exit 1; }
          if docker logs web 2>&1 | grep -qi 'migrat'; then
            echo 'le mode server ne doit pas lancer de migration'; exit 1
          fi
          docker rm -f web
      # Compose de production (deploy/, issue #16) avec la même image : Caddy
      # TLS, migrate/seed one-shot, app et worker sans volume (fichiers sur
      # Cloudinary), backup.sh. Voir scripts/smoke_compose_prod.sh.
      - name: Compose de production (deploy/)
        run: APP_IMAGE=career-transition-ai:ci scripts/smoke_compose_prod.sh

  test-backend-shards:
    name: 'test-backend (${{ matrix.shard.name }})'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: 'Backend tests (PostgreSQL) — ${{ matrix.shard.name }}'
        run: node ace test ${{ matrix.shard.suites }} ${{ matrix.shard.files != '' && format('--files="{0}"', matrix.shard.files) || '' }}
        # Aligné sur `.env.test` et sur le service `postgres_test` du
        # docker-compose.yml — les trois doivent rester alignés.
        env:
          NODE_ENV: test
          TZ: UTC
          PORT: 3333
          HOST: localhost
          APP_URL: http://localhost:3333
          APP_KEY: tests-only-app-key
          LOG_LEVEL: error
          SESSION_DRIVER: memory
          QUEUE_DRIVER: sync
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_DATABASE: test
          DB_SSL: false
          AI_PROVIDER: none

  # Job d'agrégation : l'unique check `test-backend` à exiger dans la
  # protection de branche, quel que soit le nombre de shards. Sauté (donc
  # « skipped », compté comme succès) quand `plan` l'est, sur une PR en draft.
  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, test-backend-shards]
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    steps:
      - name: Check backend shard results
        run: |
          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "Shard matrix generation failed."
            exit 1
          fi
          if [ "${{ needs.test-backend-shards.result }}" != "success" ]; then
            echo "One or more test-backend shards failed."
            exit 1
          fi
