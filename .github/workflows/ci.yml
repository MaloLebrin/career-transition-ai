name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pas de `version:` ici : l'action lit `packageManager` de package.json,
      # qui reste la source unique de vérité. Les deux en même temps font
      # échouer le setup (« Multiple versions of pnpm specified »).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  # La matrice n'est pas écrite à la main : `scripts/ci_test_shards.mjs` la
  # dérive de `tests/functional/` et équilibre les specs au fichier près. Un
  # nouveau répertoire de tests est donc shardé sans toucher à ce fichier — une
  # liste `--files` maintenue ici serait une allowlist, et tout répertoire absent
  # de cette liste ne tournerait jamais en CI sans que rien n'échoue.
  test-backend-matrix:
    name: test-backend (matrice)
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.compute.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Script sans dépendance : pas de pnpm install à payer pour 150 ms de calcul.
      - id: compute
        run: echo "shards=$(node scripts/ci_test_shards.mjs)" >> "$GITHUB_OUTPUT"
      - name: Répartition des shards
        run: node scripts/ci_test_shards.mjs --explain

  test-backend-shards:
    name: 'test-backend (${{ matrix.shard.name }})'
    runs-on: ubuntu-latest
    needs: [test-backend-matrix]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.test-backend-matrix.outputs.shards) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 'Backend tests (PostgreSQL) — ${{ matrix.shard.name }}'
        run: node ace test ${{ matrix.shard.suites }} ${{ matrix.shard.files != '' && format('--files="{0}"', matrix.shard.files) || '' }}
        # Aligné sur `.env.test` et sur le service `postgres_test` du
        # docker-compose.yml — les trois doivent rester alignés.
        env:
          NODE_ENV: test
          TZ: UTC
          PORT: 3333
          HOST: localhost
          APP_KEY: tests-only-app-key
          LOG_LEVEL: error
          SESSION_DRIVER: memory
          QUEUE_DRIVER: sync
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_DATABASE: test
          DB_SSL: false
          AI_PROVIDER: none

  # Job d'agrégation : l'unique check `test-backend` à exiger dans la
  # protection de branche, quel que soit le nombre de shards.
  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    needs: [test-backend-matrix, test-backend-shards]
    if: always()
    steps:
      - name: Check backend shard results
        run: |
          if [ "${{ needs.test-backend-matrix.result }}" != "success" ]; then
            echo "Shard matrix generation failed."
            exit 1
          fi
          if [ "${{ needs.test-backend-shards.result }}" != "success" ]; then
            echo "One or more test-backend shards failed."
            exit 1
          fi

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend tests (Vitest)
        run: pnpm test:inertia
