name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pas de `version:` ici : l'action lit `packageManager` de package.json,
      # qui reste la source unique de vérité. Les deux en même temps font
      # échouer le setup (« Multiple versions of pnpm specified »).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  # Test de fumée du build de production : `build` ne fait que compiler, et les
  # suites de tests tournent sur les sources. Ici on démarre `build/` comme en
  # production (NODE_ENV=production, dépendances de prod seules, hors du dépôt)
  # et on échoue si `/health`, `/` ou `/auth/login` ne répondent pas 200 avec
  # le rendu SSR, si un asset du manifest manque, ou si les logs du serveur ou
  # du worker contiennent une erreur ou « No jobs found for locations ».
  # Voir scripts/smoke_prod_build.mjs.
  smoke-prod-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Environnement de production minimal. La base reprend les identifiants du
    # service `postgres_test` / `.env.test` ; le reste est propre à ce job
    # (NODE_ENV=production, session cookie, queue database, LOG_LEVEL=info pour
    # voir l'avertissement de jobs introuvables).
    env:
      NODE_ENV: production
      TZ: UTC
      PORT: 3333
      HOST: 127.0.0.1
      APP_KEY: smoke-test-only-app-key-not-a-secret
      LOG_LEVEL: info
      SESSION_DRIVER: cookie
      QUEUE_DRIVER: database
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: test
      DB_PASSWORD: test
      DB_DATABASE: test
      DB_SSL: false
      AI_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Copie hors du dépôt : depuis `build/`, Node remonterait jusqu'au
      # `node_modules` racine et masquerait une dépendance de dev importée au
      # runtime. `pnpm install --prod` reproduit l'installation de production.
      - name: Installer le build comme en production
        run: |
          cp -r build "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app" && pnpm install --prod --frozen-lockfile
      - name: Migrations depuis le build
        working-directory: ${{ runner.temp }}/app
        run: node ace.js migration:run --force
      - name: Test de fumée (serveur, pages SSR, assets, worker)
        run: node scripts/smoke_prod_build.mjs --app-dir="$RUNNER_TEMP/app"

  # Image Docker (issue #14) : construit le Dockerfile tel qu'il serait déployé,
  # puis déroule les modes de l'entrypoint dans l'ordre d'un déploiement —
  # `migrate`, `seed`, `server` — et échoue si `/health` ne répond pas 200, si
  # le conteneur ne tourne pas en `node` ou si son HEALTHCHECK n'est pas
  # `healthy`. Même base et même env minimal que `smoke-prod-build`.
  docker-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image
        run: docker build -t career-transition-ai:ci .
      - name: Env du conteneur
        run: |
          cat > "$RUNNER_TEMP/docker.env" <<'EOF'
          TZ=UTC
          APP_KEY=smoke-test-only-app-key-not-a-secret
          LOG_LEVEL=info
          SESSION_DRIVER=cookie
          QUEUE_DRIVER=database
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=test
          DB_PASSWORD=test
          DB_DATABASE=test
          DB_SSL=false
          AI_PROVIDER=none
          ADMIN_PASSWORD=ci-only-admin-password
          EOF
      - name: Mode migrate
        run: docker run --rm --network host --env-file "$RUNNER_TEMP/docker.env" career-transition-ai:ci migrate
      - name: Mode seed (admin)
        run: docker run --rm --network host --env-file "$RUNNER_TEMP/docker.env" career-transition-ai:ci seed
      - name: Mode server (/health, utilisateur, HEALTHCHECK)
        run: |
          docker run -d --name web --network host --env-file "$RUNNER_TEMP/docker.env" career-transition-ai:ci server
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          [ "$code" = 200 ] || { docker logs web; echo "/health a répondu $code"; exit 1; }
          user=$(docker exec web id -un)
          [ "$user" = node ] || { echo "le conteneur tourne en $user, attendu node"; exit 1; }
          for i in $(seq 1 30); do
            health=$(docker inspect -f '{{.State.Health.Status}}' web)
            [ "$health" = healthy ] && break
            sleep 3
          done
          [ "$health" = healthy ] || { docker logs web; echo "HEALTHCHECK : $health"; exit 1; }
          if docker logs web 2>&1 | grep -qi 'migrat'; then
            echo 'le mode server ne doit pas lancer de migration'; exit 1
          fi

  # La matrice n'est pas écrite à la main : `scripts/ci_test_shards.mjs` la
  # dérive de `tests/functional/` et équilibre les specs au fichier près. Un
  # nouveau répertoire de tests est donc shardé sans toucher à ce fichier — une
  # liste `--files` maintenue ici serait une allowlist, et tout répertoire absent
  # de cette liste ne tournerait jamais en CI sans que rien n'échoue.
  test-backend-matrix:
    name: test-backend (matrice)
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.compute.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Script sans dépendance : pas de pnpm install à payer pour 150 ms de calcul.
      - id: compute
        run: echo "shards=$(node scripts/ci_test_shards.mjs)" >> "$GITHUB_OUTPUT"
      - name: Répartition des shards
        run: node scripts/ci_test_shards.mjs --explain

  test-backend-shards:
    name: 'test-backend (${{ matrix.shard.name }})'
    runs-on: ubuntu-latest
    needs: [test-backend-matrix]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.test-backend-matrix.outputs.shards) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 'Backend tests (PostgreSQL) — ${{ matrix.shard.name }}'
        run: node ace test ${{ matrix.shard.suites }} ${{ matrix.shard.files != '' && format('--files="{0}"', matrix.shard.files) || '' }}
        # Aligné sur `.env.test` et sur le service `postgres_test` du
        # docker-compose.yml — les trois doivent rester alignés.
        env:
          NODE_ENV: test
          TZ: UTC
          PORT: 3333
          HOST: localhost
          APP_KEY: tests-only-app-key
          LOG_LEVEL: error
          SESSION_DRIVER: memory
          QUEUE_DRIVER: sync
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_DATABASE: test
          DB_SSL: false
          AI_PROVIDER: none

  # Job d'agrégation : l'unique check `test-backend` à exiger dans la
  # protection de branche, quel que soit le nombre de shards.
  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    needs: [test-backend-matrix, test-backend-shards]
    if: always()
    steps:
      - name: Check backend shard results
        run: |
          if [ "${{ needs.test-backend-matrix.result }}" != "success" ]; then
            echo "Shard matrix generation failed."
            exit 1
          fi
          if [ "${{ needs.test-backend-shards.result }}" != "success" ]; then
            echo "One or more test-backend shards failed."
            exit 1
          fi

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend tests (Vitest)
        run: pnpm test:inertia
